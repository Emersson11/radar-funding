name: Alertas de funding
on:
  schedule:
    - cron: "7 * * * *"   # a cada hora, no minuto 7
  workflow_dispatch:
permissions:
  contents: write
jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python alertas.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar o estado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add estado_alertas.json
          git diff --cached --quiet || (git commit -m "Atualiza estado dos alertas" && git push)
