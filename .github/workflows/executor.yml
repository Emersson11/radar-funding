name: Robo de execucao (simulacao)
on:
  schedule:
    - cron: "37 * * * *"   # a cada hora, no minuto 37
  workflow_dispatch:
permissions:
  contents: write
concurrency: executor
jobs:
  executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python executor.py
        env:
          MODO: simulacao
          CAPITAL: "100"
          ALAVANCAGEM: "1"
          CORRETORAS: hyper,okx,gate,bitget
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar a carteira simulada
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add carteira.json
          git diff --cached --quiet || (git commit -m "Atualiza carteira simulada" && git pull --rebase && git push)
