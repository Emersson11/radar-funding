name: Dados de mercado
on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mercado
  cancel-in-progress: false
jobs:
  mercado:
    runs-on: ubuntu-latest
    env:
      SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Recuperar a coleta anterior
        run: curl -sfL "https://ogpwdonofbcubnwykiae.supabase.co/storage/v1/object/public/dados/mercado.json" -o mercado.json || curl -sfL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/dados/mercado.json" -o mercado.json || true
      - run: python mercado.py
      - name: Publicar no ramo de dados (um unico commit, sem reconstruir o site)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pub && cp mercado.json /tmp/pub/ && cd /tmp/pub
          git init -q -b dados
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add mercado.json && git commit -qm "Dados de mercado"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados
      - name: Enviar ao Supabase (para o site ler quando o repositorio for privado)
        if: ${{ env.SB_KEY != '' }}
        run: |
          curl -sf -X POST "https://ogpwdonofbcubnwykiae.supabase.co/storage/v1/object/dados/mercado.json" -H "Authorization: Bearer ${SB_KEY}" -H "apikey: ${SB_KEY}" -H "x-upsert: true" -H "Content-Type: application/json" -H "cache-control: max-age=60" --data-binary @mercado.json
