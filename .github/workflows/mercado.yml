name: Dados de mercado
on:
  schedule:
    - cron: "17 * * * *"   # a cada hora, no minuto 17
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mercado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python mercado.py
      - name: Guardar os dados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add mercado.json
          git diff --cached --quiet || (git commit -m "Atualiza dados de mercado" && git pull --rebase && git push)
