# =====================================================================
#  FONTES — importadas do site Altside Macro Research
#  (https://altside-macro-research.vercel.app — aba "Fontes e casas",
#   feed de notícias e fontes adicionadas manualmente)
# =====================================================================
#  tipo rss   = feed de notícias (pega os links novos automaticamente)
#  tipo auto  = o programa procura o feed RSS do site sozinho; se não
#               houver, monitora a própria página e detecta mudanças
#  tipo telegram = canal público do Telegram (t.me/s/nome) — é onde
#               vários perfis do X republicam seus posts e gráficos
#  tipo page  = uma página específica
#  tipo json  = endereço de API que devolve JSON
#  ativo: sim / nao    intervalo_min: minutos entre coletas
#  max_itens: quantos textos novos pegar de cada feed por coleta
#
#  Os espaços no começo das linhas importam (2 e 4 espaços).
#  O sistema respeita o robots.txt de cada site.
# =====================================================================

fontes:

  # ---------------------------------------------------------------
  # NOTÍCIAS CRIPTO E MACRO (as mesmas do feed automático do site)
  # ---------------------------------------------------------------
